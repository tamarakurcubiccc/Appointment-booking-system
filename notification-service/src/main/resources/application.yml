server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: notification-service

  datasource:
    # useSSL=false together with allowPublicKeyRetrieval=true is required for MySQL 8 over
    # a plain connection: the caching_sha2_password handshake otherwise refuses to hand over
    # the server public key. serverTimezone pins UTC so Instant values are never shifted.
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/${DB_NAME:notification_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
    hikari:
      maximum-pool-size: 10
      pool-name: notification-service-pool

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    serialization:
      write-dates-as-timestamps: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:booking}
    password: ${RABBITMQ_PASSWORD:booking}
    listener:
      simple:
        # A message the consumer rejects is NOT requeued - it goes to the dead-letter
        # exchange. Without this a malformed message would loop forever.
        default-requeue-rejected: false
        retry:
          # Transient failures (SMTP down, user-service restarting) are retried with
          # exponential backoff; after max-attempts the message lands on the DLQ.
          enabled: true
          initial-interval: 2s
          max-attempts: 4
          multiplier: 2
          max-interval: 20s

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # The local SMTP server (Mailpit) needs neither authentication nor TLS.
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
            logger-level: basic
      circuitbreaker:
        enabled: false

notifications:
  # When false, no e-mail is handed to SMTP - it is only recorded and logged. Useful for
  # local development without a mail server; notifications stay readable via /api/notifications.
  mail-enabled: ${MAIL_ENABLED:true}
  from-address: ${MAIL_FROM:no-reply@appointment-booking.local}
  # Times are stored in UTC and rendered in this zone inside the message text.
  time-zone: ${NOTIFICATIONS_TIME_ZONE:Europe/Belgrade}
  activation-base-url: ${ACTIVATION_BASE_URL:http://localhost:8080/api/auth/activate}
  password-reset-base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:8080/api/auth/reset-password}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.booking: INFO
