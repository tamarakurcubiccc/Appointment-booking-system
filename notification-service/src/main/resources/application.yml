server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:notification_db}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
    hikari:
      maximum-pool-size: 10
      pool-name: notification-service-pool

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    serialization:
      write-dates-as-timestamps: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:booking}
    password: ${RABBITMQ_PASSWORD:booking}
    listener:
      simple:
        # Poruka koju potrošač odbije NE ide nazad u red, već u dead-letter exchange.
        # Bez ovoga bi neispravna poruka kružila u beskonačnoj petlji.
        default-requeue-rejected: false
        retry:
          # Prolazne greške (SMTP nedostupan, user-service se restartuje) se ponavljaju
          # sa eksponencijalnim čekanjem; nakon max-attempts poruka ide na DLQ.
          enabled: true
          initial-interval: 2s
          max-attempts: 4
          multiplier: 2
          max-interval: 20s

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # Lokalni SMTP (Mailpit) ne traži autentikaciju ni TLS.
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
            logger-level: basic
      circuitbreaker:
        enabled: false

notifications:
  # Kada je false, e-mail se ne šalje - samo se zapiše i oblogira. Korisno za lokalni
  # razvoj bez SMTP servera; obaveštenja su i dalje vidljiva preko /api/notifications.
  mail-enabled: ${MAIL_ENABLED:true}
  from-address: ${MAIL_FROM:no-reply@appointment-booking.local}
  # Vremena su u bazi u UTC; u e-mailu se prikazuju u lokalnoj zoni korisnika.
  time-zone: ${NOTIFICATIONS_TIME_ZONE:Europe/Belgrade}
  activation-base-url: ${ACTIVATION_BASE_URL:http://localhost:8080/api/auth/activate}
  password-reset-base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:8080/api/auth/reset-password}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.booking: INFO
