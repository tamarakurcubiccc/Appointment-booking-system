# ---------------------------------------------------------------------------
# Serves the built bundle and forwards /api to the gateway.
#
# The browser therefore talks to a single origin and CORS never comes into play - the
# alternative, calling the gateway directly from the page, would mean maintaining an
# allow-list of origins for every environment the client runs in.
#
# The gateway address comes from the GATEWAY_URL environment variable, substituted into
# this template at container start (see the Dockerfile), so the same image works in
# Docker Compose and in Kubernetes where the service name differs.
# ---------------------------------------------------------------------------
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset file names never change content, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass ${GATEWAY_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The gateway strips any identity headers a client sends and injects its own
        # after validating the JWT, so nothing needs to be filtered here.
        proxy_read_timeout 30s;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Single-page application: unknown paths are routes, not missing files. Without this
    # a reload on /rezervacije - or opening an activation link - would return 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
