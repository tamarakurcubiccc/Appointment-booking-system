# ---------------------------------------------------------------------------
# Runs on every push and pull request. Three independent jobs so a failure points
# straight at what broke: the services, the client, or the manifests.
# ---------------------------------------------------------------------------
name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  services:
    name: Services (Maven, Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          # Caches ~/.m2 keyed on the pom files, so a build that changes no dependency
          # does not download the internet again.
          cache: maven

      # `package` rather than `test`: this also proves every module still assembles into
      # a runnable jar, which is what the images are built from.
      - name: Build and test
        run: mvn -B package

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore

  web-client:
    name: Web client (Vite, Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      # `npm ci` installs exactly what the lockfile pins and fails if the two disagree,
      # which is the point of running it in CI rather than `npm install`.
      - name: Install dependencies
        run: npm ci

      # `npm run build` runs tsc first, so this fails on a type error as well.
      - name: Type-check and build
        run: npm run build

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      # Renders the kustomization without a cluster: catches a YAML error, a missing
      # file in resources, or a deprecated field before it is ever applied.
      - name: Render manifests
        run: kubectl kustomize k8s/ > /dev/null

      - name: Validate the Compose file
        run: docker compose config --quiet
