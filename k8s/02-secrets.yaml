# ---------------------------------------------------------------------------
# DEVELOPMENT VALUES ONLY.
#
# A Secret is base64-encoded, not encrypted, so a file like this belongs in git only
# because every value here is a throwaway for local use. For anything real, create the
# Secret out of band and keep it out of the repository:
#
#   kubectl -n appointment-booking create secret generic booking-secrets \
#     --from-literal=DB_USER=booking \
#     --from-literal=DB_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=MYSQL_ROOT_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=RABBITMQ_USER=booking \
#     --from-literal=RABBITMQ_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=ADMIN_PASSWORD="$(openssl rand -base64 18)"
#
# stringData is used instead of data so the values stay readable; Kubernetes encodes
# them on the way in.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: booking-secrets
  namespace: appointment-booking
  labels:
    app.kubernetes.io/part-of: appointment-booking
type: Opaque
stringData:
  # The account every service uses for its own database. Nothing connects as root.
  DB_USER: "booking"
  DB_PASSWORD: "booking"
  # Only used to initialise the MySQL containers and by their probes.
  MYSQL_ROOT_PASSWORD: "root"

  # Base64-encoded 256-bit HMAC key, shared by api-gateway and user-service.
  JWT_SECRET: "ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY3ODkw"

  RABBITMQ_USER: "booking"
  RABBITMQ_PASSWORD: "booking"

  # The initial admin account created by user-service on first start.
  ADMIN_PASSWORD: "admin12345"
