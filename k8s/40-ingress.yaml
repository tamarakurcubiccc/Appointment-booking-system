# ---------------------------------------------------------------------------
# Outside traffic enters here. Two paths, in order of specificity:
#
#   /api  -> api-gateway   (the only way into the services)
#   /     -> web-client    (the React bundle and its routes)
#
# The client's own nginx can also proxy /api, which is what the Docker Compose setup
# uses; routing /api here as well saves a hop and keeps the gateway the single entry
# point for the API either way.
#
# Needs an ingress controller (ingress-nginx). Without one, both parts are reachable
# with no extra moving parts:
#
#   kubectl -n appointment-booking port-forward svc/web-client 3000:8080
#   kubectl -n appointment-booking port-forward svc/api-gateway 8080:8080
#
# For the host name to resolve, add it to the hosts file:
#   Windows  C:\Windows\System32\drivers\etc\hosts
#   Linux    /etc/hosts
#
#   127.0.0.1  appointment-booking.local
#
# Mailpit and the RabbitMQ console are deliberately NOT exposed through the Ingress -
# they are development tools, and anything that reads other people's mail or the message
# bus has no business being reachable from outside. Reach them with port-forward:
#   kubectl -n appointment-booking port-forward svc/mailpit 8025:8025
#   kubectl -n appointment-booking port-forward svc/rabbitmq 15672:15672
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: appointment-booking
  namespace: appointment-booking
  labels:
    app.kubernetes.io/part-of: appointment-booking
spec:
  ingressClassName: nginx
  rules:
    - host: appointment-booking.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-client
                port:
                  number: 8080
