# ---------------------------------------------------------------------------
# Local SMTP server. Nothing it receives ever leaves the cluster; its web interface
# shows every message the system sent, which is what makes the notification flow
# demonstrable without a real mail provider.
#
# Deployment, not StatefulSet, and no volume: captured mail is throwaway test data.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: appointment-booking
  labels:
    app: mailpit
    app.kubernetes.io/part-of: appointment-booking
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: appointment-booking
  labels:
    app: mailpit
    app.kubernetes.io/part-of: appointment-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
        app.kubernetes.io/part-of: appointment-booking
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.33
          ports:
            - containerPort: 1025
            - containerPort: 8025
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8025
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /readyz
              port: 8025
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
