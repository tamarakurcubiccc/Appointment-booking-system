# ---------------------------------------------------------------------------
# Bookings, cancellations and loyalty-reward redemption.
#
# Calls catalog-service, user-service and loyalty-service over REST, and publishes
# reservation.created and reservation.cancelled for the two consumers.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: reservation-service
  namespace: appointment-booking
  labels:
    app: reservation-service
    app.kubernetes.io/part-of: appointment-booking
spec:
  selector:
    app: reservation-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-service
  namespace: appointment-booking
  labels:
    app: reservation-service
    app.kubernetes.io/part-of: appointment-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservation-service
  template:
    metadata:
      labels:
        app: reservation-service
        app.kubernetes.io/part-of: appointment-booking
    spec:
      containers:
        - name: reservation-service
          # Built locally by `make k8s-images`; never pulled from a registry.
          image: appointment-booking-reservation-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: booking-config
            - secretRef:
                name: booking-secrets
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: DB_HOST
              value: mysql-reservation
            - name: DB_NAME
              value: reservation_db
          # Kubernetes has no equivalent of Compose's depends_on, so a pod that starts
          # before its database or the broker will fail and be restarted. The startup
          # probe is what makes that harmless: it allows up to ~150s to come up, and
          # only then does the short-period liveness probe take over.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: 320Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: "1"
