# ---------------------------------------------------------------------------
# Loyalty rules, appointment counters and rewards.
#
# Consumes reservation.created and reservation.cancelled to keep the counters, and
# serves reward redemption synchronously to reservation-service.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: loyalty-service
  namespace: appointment-booking
  labels:
    app: loyalty-service
    app.kubernetes.io/part-of: appointment-booking
spec:
  selector:
    app: loyalty-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loyalty-service
  namespace: appointment-booking
  labels:
    app: loyalty-service
    app.kubernetes.io/part-of: appointment-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loyalty-service
  template:
    metadata:
      labels:
        app: loyalty-service
        app.kubernetes.io/part-of: appointment-booking
    spec:
      # Kubernetes has no equivalent of Compose's depends_on. Spring Boot exits when it
      # cannot reach its database at startup, so without this the pod would crash and be
      # restarted until the database happened to be up - which works, but fills the first
      # minute of a cold cluster with CrashLoopBackOff noise. Waiting here instead keeps
      # the restart count at zero and makes a genuine restart meaningful.
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z mysql-loyalty 3306; do echo "waiting for mysql-loyalty"; sleep 2; done
              until nc -z rabbitmq 5672; do echo "waiting for rabbitmq"; sleep 2; done
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
      containers:
        - name: loyalty-service
          # Built locally by `make k8s-images`; never pulled from a registry.
          image: appointment-booking-loyalty-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: booking-config
            - secretRef:
                name: booking-secrets
          env:
            - name: SERVER_PORT
              value: "8085"
            - name: DB_HOST
              value: mysql-loyalty
            - name: DB_NAME
              value: loyalty_db
          # The startup probe allows a generous ~150s for the JVM and Eureka registration
          # without making the liveness probe permanently lax: once it passes, liveness
          # takes over with a short period and actually notices a hung process.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: 320Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: "1"
