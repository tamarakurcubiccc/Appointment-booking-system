# ---------------------------------------------------------------------------
# Registration, login, JWT issuing, activation and password-reset tokens.
#
# Publishes user.registered and user.password-reset-requested, and creates the initial
# admin account from ADMIN_EMAIL / ADMIN_PASSWORD on first start.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: appointment-booking
  labels:
    app: user-service
    app.kubernetes.io/part-of: appointment-booking
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: appointment-booking
  labels:
    app: user-service
    app.kubernetes.io/part-of: appointment-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        app.kubernetes.io/part-of: appointment-booking
    spec:
      # Kubernetes has no equivalent of Compose's depends_on. Spring Boot exits when it
      # cannot reach its database at startup, so without this the pod would crash and be
      # restarted until the database happened to be up - which works, but fills the first
      # minute of a cold cluster with CrashLoopBackOff noise. Waiting here instead keeps
      # the restart count at zero and makes a genuine restart meaningful.
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z mysql-user 3306; do echo "waiting for mysql-user"; sleep 2; done
              until nc -z rabbitmq 5672; do echo "waiting for rabbitmq"; sleep 2; done
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
      containers:
        - name: user-service
          # Built locally by `make k8s-images`; never pulled from a registry.
          image: appointment-booking-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: booking-config
            - secretRef:
                name: booking-secrets
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: DB_HOST
              value: mysql-user
            - name: DB_NAME
              value: user_db
          # The startup probe allows a generous ~150s for the JVM and Eureka registration
          # without making the liveness probe permanently lax: once it passes, liveness
          # takes over with a short period and actually notices a hung process.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: 320Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: "1"
