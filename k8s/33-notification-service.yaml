# ---------------------------------------------------------------------------
# Notification templates and e-mail dispatch.
#
# Consumes four event types, renders the stored templates and hands the result to
# Mailpit. Failed messages end up on notification.dlq.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: appointment-booking
  labels:
    app: notification-service
    app.kubernetes.io/part-of: appointment-booking
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: appointment-booking
  labels:
    app: notification-service
    app.kubernetes.io/part-of: appointment-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        app.kubernetes.io/part-of: appointment-booking
    spec:
      containers:
        - name: notification-service
          # Built locally by `make k8s-images`; never pulled from a registry.
          image: appointment-booking-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: booking-config
            - secretRef:
                name: booking-secrets
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: DB_HOST
              value: mysql-notification
            - name: DB_NAME
              value: notification_db
          # Kubernetes has no equivalent of Compose's depends_on, so a pod that starts
          # before its database or the broker will fail and be restarted. The startup
          # probe is what makes that harmless: it allows up to ~150s to come up, and
          # only then does the short-period liveness probe take over.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: 320Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: "1"
