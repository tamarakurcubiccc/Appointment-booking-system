# ---------------------------------------------------------------------------
# The single entry point. No other service is exposed outside the cluster: the five
# business services and the registry have ClusterIP Services only, reachable from
# inside the namespace, and /api/internal/** is additionally blocked at the gateway.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: appointment-booking
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: appointment-booking
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: appointment-booking
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: appointment-booking
spec:
  # The gateway is stateless, so it is the one component worth running more than once:
  # a rolling update then never leaves the system without an entry point.
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/part-of: appointment-booking
    spec:
      containers:
        - name: api-gateway
          image: appointment-booking-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: booking-config
            - secretRef:
                name: booking-secrets
          env:
            - name: SERVER_PORT
              value: "8080"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 640Mi
              cpu: "1"
