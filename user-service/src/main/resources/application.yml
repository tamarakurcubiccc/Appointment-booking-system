server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service

  datasource:
    # useSSL=false together with allowPublicKeyRetrieval=true is required for MySQL 8 over
    # a plain connection: the caching_sha2_password handshake otherwise refuses to hand over
    # the server public key. serverTimezone pins UTC so Instant values are never shifted.
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:user_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
    hikari:
      maximum-pool-size: 10
      pool-name: user-service-pool

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:booking}
    password: ${RABBITMQ_PASSWORD:booking}

security:
  # The first admin account, created at startup when both values are set. Nothing is
  # created when they are empty, so a real deployment that leaves them unset gets no
  # account with a known password.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:Administrator}

  tokens:
    # One-time links sent by e-mail. The reset window is short on purpose: the link is
    # enough to take over the account, so it should not stay valid for long.
    activation-ttl: ${ACTIVATION_TTL:24h}
    password-reset-ttl: ${PASSWORD_RESET_TTL:1h}

  jwt:
    # Base64-encoded 256-bit key. Override in every environment (see .env.example).
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY3ODkw}
    issuer: ${JWT_ISSUER:appointment-booking-system}
    expiration: ${JWT_EXPIRATION:3600}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.booking: INFO
